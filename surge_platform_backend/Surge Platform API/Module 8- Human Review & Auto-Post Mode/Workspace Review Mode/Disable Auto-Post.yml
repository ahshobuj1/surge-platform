info:
  name: Disable Auto-Post
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/auto-post"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "autoPost": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Disable auto-posting to keep generated drafts in review-first mode.
