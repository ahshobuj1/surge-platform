info:
  name: Enable Auto-Post
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/auto-post"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "autoPost": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Enable auto-posting for the workspace so new generated drafts can bypass review and publish automatically.
