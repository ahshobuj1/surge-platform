info:
  name: Get RSS Feed By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/rss-feeds/:id"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific RSS feed record by numeric ID.
