info:
  name: List RSS Feeds
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/rss-feeds"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all RSS feed records.
