info:
  name: Update RSS Feed
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/rss-feeds/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "feedUrl": "https://techcrunch.com/feed/updated"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Update an RSS feed record by numeric ID.
