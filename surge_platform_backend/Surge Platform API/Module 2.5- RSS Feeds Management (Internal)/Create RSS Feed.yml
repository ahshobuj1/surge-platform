info:
  name: Create RSS Feed
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rss-feeds"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "feedUrl": "https://techcrunch.com/feed/"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a new RSS feed record.
