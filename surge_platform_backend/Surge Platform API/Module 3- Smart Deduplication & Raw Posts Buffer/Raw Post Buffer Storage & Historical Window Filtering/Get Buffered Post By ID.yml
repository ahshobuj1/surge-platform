info:
  name: Get Buffered Post By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/buffer-posts/{{bufferPostId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific buffered post by ID.
