info:
  name: Update Buffered Post
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/buffer-posts/{{bufferPostId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "status": "buffered"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Update a buffered post's status.
