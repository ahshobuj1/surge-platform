info:
  name: Get Raw Post By ID
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/raw-posts/{{rawPostId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific raw post by ID.
