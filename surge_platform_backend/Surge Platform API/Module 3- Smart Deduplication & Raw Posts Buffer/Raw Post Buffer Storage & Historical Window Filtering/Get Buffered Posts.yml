info:
  name: Get Buffered Posts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/buffer-posts?days=3"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  params:
    - name: days
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve buffered posts for a workspace within a given time window (days parameter).
