info:
  name: Approve Generated Draft
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/generated-drafts/{{generatedDraftId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "action": "approve"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Approve a draft for publishing. Sets the draft status to 'approved' via the action field.
