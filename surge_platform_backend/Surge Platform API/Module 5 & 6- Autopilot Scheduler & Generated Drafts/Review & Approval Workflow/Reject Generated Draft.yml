info:
  name: Reject Generated Draft
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/generated-drafts/{{generatedDraftId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "action": "reject",
        "status": "rejected"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Reject a draft. Sets the draft status to 'rejected'.
