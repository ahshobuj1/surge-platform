info:
  name: Get Generated Draft By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/generated-drafts/{{generatedDraftId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific generated draft by ID. Access is scoped by user's workspace membership.
