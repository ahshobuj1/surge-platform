info:
  name: Get RSS Source By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/rss-sources/{{sourceId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific RSS source by ID.
