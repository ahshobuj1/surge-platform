info:
  name: List RSS Sources
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/rss-sources"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all RSS sources for a workspace.
