info:
  name: Get Tone Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tone-profiles/{{toneProfileId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieves detail parameters and step prompts of a specific tone profile.
