info:
  name: Delete Tone Profile
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/tone-profiles/{{toneProfileId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Deletes a tone profile (Admin Only).
