opencollection: 1.0.0

info:
  name: Surge Platform API

request:
  auth:
    mode: bearer
    bearer:
      token: "{{jwtToken}}"
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: jwtToken
      value: ""
    - name: refreshToken
      value: ""
    - name: workspaceId
      value: 11111111-aaaa-4bbb-8ccc-abcdef123456
    - name: companyId
      value: 22222222-bbbb-4ccc-8ddd-abcdef654321
    - name: createdById
      value: bbbbbbbb-1111-4ccc-8ddd-abcdef123456
    - name: sourceId
      value: 44444444-dddd-4eee-8fff-abcdef000000
    - name: bufferPostId
      value: 55555555-eeee-4fff-9aaa-abcdef111111
    - name: rawPostId
      value: 55555555-eeee-4fff-9aaa-abcdef111111
    - name: generatedDraftId
      value: 66666666-ffff-4aaa-9bbb-abcdef222222
    - name: publishingChannelId
      value: 77777777-aaaa-4bbb-9ccc-abcdef333333
    - name: toneProfileId
      value: aaaaaaaa-dddd-4eee-9fff-abcdef666666
    - name: failedJobId
      value: "1"
    - name: minioAssetUrl
      value: http://localhost:9000/surge-assets/fallback-placeholder.png

docs:
  content: Complete API collection for the Surge Platform — a multi-tenant SaaS content automation engine. Covers auth, workspaces, RSS ingestion, AI creative pipeline, tone profiles, generated drafts, dispatcher, publishing channels, storage, and queue monitoring.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
