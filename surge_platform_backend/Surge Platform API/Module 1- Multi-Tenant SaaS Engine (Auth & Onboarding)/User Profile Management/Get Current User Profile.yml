info:
  name: Get Current User Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve the currently authenticated user's profile details.
