info:
  name: List Workspaces
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/workspaces"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all workspaces accessible by the authenticated user.
