info:
  name: Get My Company
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/companies/me"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve the company that belongs to the currently authenticated user.
