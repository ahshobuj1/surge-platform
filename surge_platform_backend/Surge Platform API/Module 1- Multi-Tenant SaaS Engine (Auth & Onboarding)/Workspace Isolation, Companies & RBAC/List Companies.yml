info:
  name: List Companies
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/companies"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all companies accessible by the authenticated user.
