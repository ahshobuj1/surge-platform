info:
  name: Update Company
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/companies/{{companyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "name": "Acme Media Labs Updated"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Update a company's details.
