info:
  name: Create Workspace
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/workspaces"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{jwtToken}}
  body:
    type: json
    data: |-
      {
        "name": "Operations",
        "companyId": "{{companyId}}",
        "timezone": "UTC"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a new workspace under a company.
