info:
  name: Get Workspace Analytics
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/workspaces/{{workspaceId}}/analytics"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve analytics data for a workspace.
