info:
  name: Get Company By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/companies/{{companyId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve a specific company by ID.
