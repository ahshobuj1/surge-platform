info:
  name: Request Password Reset
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/request-password-reset"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Send a password reset OTP to the user's email. Rate limited to 3 requests per 60 seconds.
