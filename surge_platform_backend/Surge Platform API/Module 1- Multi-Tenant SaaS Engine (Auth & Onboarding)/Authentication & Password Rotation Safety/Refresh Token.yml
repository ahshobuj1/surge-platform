info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        if (json && json.data && json.data.accessToken) {
          bru.setCollectionVar('jwtToken', json.data.accessToken);
        }
        if (json && json.data && json.data.refreshToken) {
          bru.setCollectionVar('refreshToken', json.data.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Exchange a refresh token for a new access + refresh token pair.
