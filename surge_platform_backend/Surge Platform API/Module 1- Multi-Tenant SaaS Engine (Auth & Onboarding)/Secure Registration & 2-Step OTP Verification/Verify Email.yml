info:
  name: Verify Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Verify email address using the OTP token sent during registration.
