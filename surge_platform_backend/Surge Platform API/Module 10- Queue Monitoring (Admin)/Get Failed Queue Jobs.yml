info:
  name: Get Failed Queue Jobs
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/queues/failed"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists failed jobs with stack traces for debugging (Admin Only).
