info:
  name: Clean Queue History
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/queues/clean"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Cleans the completed and failed job histories (Admin Only).
