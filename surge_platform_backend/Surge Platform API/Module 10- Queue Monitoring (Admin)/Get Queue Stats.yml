info:
  name: Get Queue Stats
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/queues/stats"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Fetches BullMQ job state counts for content-generation-queue (Admin Only).
