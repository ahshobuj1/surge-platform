info:
  name: Get OAuth Authorize URL
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/publishing-channels/oauth/linkedin/authorize?workspaceId={{workspaceId}}"
  params:
    - name: workspaceId
      value: "{{workspaceId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the OAuth authorization URL for a platform (e.g., linkedin). The :platform path segment is dynamic.
