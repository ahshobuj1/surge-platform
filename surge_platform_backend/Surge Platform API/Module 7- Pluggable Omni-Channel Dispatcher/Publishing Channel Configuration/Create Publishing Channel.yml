info:
  name: Create Publishing Channel
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/publishing-channels"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "workspaceId": "{{workspaceId}}",
        "platform": "wordpress",
        "credentials": {
          "endpoint": "https://example-blog.com/wp-json",
          "username": "admin",
          "password": "app-password-secret"
        },
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a new publishing channel for a workspace (e.g., WordPress, LinkedIn, Facebook).
