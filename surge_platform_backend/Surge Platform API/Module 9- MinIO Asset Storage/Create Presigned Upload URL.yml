info:
  name: Create Presigned Upload URL
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/storage/presigned-upload"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "contentType": "image/png",
        "folder": "drafts",
        "fileName": "ai-generated-cover.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Generate a presigned URL for uploading a file to MinIO. Returns the upload URL and object key.
