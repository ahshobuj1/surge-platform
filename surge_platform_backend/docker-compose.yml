services:
    postgres:
        image: postgres:17
        container_name: surge_platform_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: surge_platform_user
            POSTGRES_PASSWORD: surge_platform_password
            POSTGRES_DB: surge_platform_db
        ports:
            - '5437:5432'
        volumes:
            - surge_platform_data:/var/lib/postgresql/data
        networks:
            - surge_platform_network

    redis:
        image: redis:alpine
        container_name: surge_platform_redis
        restart: unless-stopped
        ports:
            - '6381:6379'
        networks:
            - surge_platform_network

    rustfs:
        image: rustfs/rustfs:latest
        container_name: surge_platform_rustfs
        restart: unless-stopped
        environment:
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
            RUSTFS_CONSOLE_ENABLE: "true"
        command: /data
        ports:
            - '9010:9000'
            - '9011:9001'
        volumes:
            - rustfs_data:/data
        networks:
            - surge_platform_network

networks:
    surge_platform_network:
        driver: bridge
        name: surge_platform_network

volumes:
    surge_platform_data:
        driver: local
        name: surge_platform_data
    rustfs_data:
        driver: local
        name: rustfs_data
